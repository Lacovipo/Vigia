[package]
name = "vigia"
version = "0.37.0"
edition = "2021"

[lib]
name = "vigia"
path = "src/lib.rs"

[[bin]]
name = "vigia"
path = "src/main.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "banco"
path = "src/bin/banco/main.rs"

[[bin]]
name = "generador"
path = "src/bin/generador.rs"

# Perfil de tiempo por fases: solo con `--features perfil` (src/perfil.rs).
[[bin]]
name = "perfil"
path = "src/bin/perfil.rs"
required-features = ["perfil"]

[features]
# Apagada por defecto: sin ella las guardas de fase no generan código.
perfil = []

[profile.release]
lto = true
codegen-units = 1

[dependencies]
